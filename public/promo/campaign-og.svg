    <text x="108" y="156" fill="#f23878" text-anchor="middle" font-size="42" font-weight="900" font-family="Arial, sans-serif">推し</text>
    <rect x="44" y="236" width="128" height="20" rx="10" fill="#ffffff" opacity="0.88"/>
    <rect x="60" y="270" width="88" height="20" rx="10" fill="#ffd85d" opacity="0.94"/>
