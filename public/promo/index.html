<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vtuberマッチ 販促画像</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f7f4ee;
        color: #13201c;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        gap: 24px;
        max-width: 1120px;
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      img {
        width: 100%;
        border: 1px solid #ded8cb;
        border-radius: 8px;
        background: #fffdf8;
      }
      @media (max-width: 760px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vtuberマッチ 販促画像</h1>
      <section class="grid">
        <img src="./creator-promo.svg" alt="配信者向け販促画像" />
        <img src="./viewer-promo.svg" alt="視聴者向け販促画像" />
      </section>
    </main>
  </body>
</html>
